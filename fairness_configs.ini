; fairness_configs.ini — victim (Tenant A) + noisy-neighbor (Tenant B) workloads.
;
; Sizes are chosen relative to the cgroup memory cap (memory.max = 2G in
; cgroup_shared.ini): 512M is 0.25x the cap (fits), 32G is 16x the cap.
;
; The two sections used by `dual` mode MUST be named client1_steady (A) and
; client2_noisy (B). Run either section alone for Case 1 baselines.


; ================================================================
; Tenant A — the victim (what we measure: clat p99)
; ================================================================
[client1_steady]
description = Victim: 512M randread at 50k IOPS for 60s on every phase
file_size = 512M

phase_0_pattern = randread
phase_0_block_size = 4k
phase_0_rate_iops = 50000
phase_0_iodepth = 8
phase_0_numjobs = 1
phase_0_runtime = 60
phase_0_ioengine = libaio

phase_1_pattern = randread
phase_1_block_size = 4k
phase_1_rate_iops = 50000
phase_1_iodepth = 8
phase_1_numjobs = 1
phase_1_runtime = 60
phase_1_ioengine = libaio

phase_2_pattern = randread
phase_2_block_size = 4k
phase_2_rate_iops = 50000
phase_2_iodepth = 8
phase_2_numjobs = 1
phase_2_runtime = 60
phase_2_ioengine = libaio

phase_3_pattern = randread
phase_3_block_size = 4k
phase_3_rate_iops = 50000
phase_3_iodepth = 8
phase_3_numjobs = 1
phase_3_runtime = 60
phase_3_ioengine = libaio


; ================================================================
; Tenant B — client2 (aggressor). Each phase is 60s. rate_iops is per job.
;   phase 0: 1024 IOPS x 1 job x 4k → ~240 MiB (little eviction)
;   phase 1: 73000 IOPS x 4 jobs → reads issued exceed the 32G file and the 2G pool
;   phase 2: same as phase 0 (quiet)
;   phase 3: same as phase 0 (quiet)
; ================================================================
[client2_noisy]
description = Aggressor: 32G sequential read, 1k -> 73k x4 -> 1k -> 1k over 60s phases
file_size = 32G

phase_0_pattern = read
phase_0_block_size = 4k
phase_0_rate_iops = 1024
phase_0_iodepth = 8
phase_0_numjobs = 1
phase_0_runtime = 60
phase_0_ioengine = libaio

phase_1_pattern = read
phase_1_block_size = 4k
phase_1_rate_iops = 73000
phase_1_iodepth = 8
phase_1_numjobs = 4
phase_1_runtime = 60
phase_1_ioengine = libaio

phase_2_pattern = read
phase_2_block_size = 4k
phase_2_rate_iops = 1024
phase_2_iodepth = 8
phase_2_numjobs = 1
phase_2_runtime = 60
phase_2_ioengine = libaio

phase_3_pattern = read
phase_3_block_size = 4k
phase_3_rate_iops = 1024
phase_3_iodepth = 8
phase_3_numjobs = 1
phase_3_runtime = 60
phase_3_ioengine = libaio
