; fairness_configs_multi.ini — three tenants on one shared page cache.
;
; Two latency-sensitive readers and one noisy neighbor. Together the two good
; working sets are 512 MiB, the same hot footprint as client1_steady in
; fairness_configs.ini, split across two tenants. 32G is 16x the 2G shared cap
; in cgroup_shared_multi.ini.
;
; client3_noisy reads the existing test_file_client2_noisy_32G. Run them
; together with: ./benchmark -c fairness_configs_multi.ini multi


; ================================================================
; Good tenants — what we measure: clat p99. Identical randread on every phase.
; ================================================================
[client1_good]
description = Good tenant: 256M randread at 50k IOPS for 60s on every phase
file_size = 256M

phase_0_pattern = randread
phase_0_block_size = 4k
phase_0_rate_iops = 50000
phase_0_iodepth = 8
phase_0_numjobs = 1
phase_0_runtime = 60
phase_0_ioengine = libaio

phase_1_pattern = randread
phase_1_block_size = 4k
phase_1_rate_iops = 50000
phase_1_iodepth = 8
phase_1_numjobs = 1
phase_1_runtime = 60
phase_1_ioengine = libaio

phase_2_pattern = randread
phase_2_block_size = 4k
phase_2_rate_iops = 50000
phase_2_iodepth = 8
phase_2_numjobs = 1
phase_2_runtime = 60
phase_2_ioengine = libaio

phase_3_pattern = randread
phase_3_block_size = 4k
phase_3_rate_iops = 50000
phase_3_iodepth = 8
phase_3_numjobs = 1
phase_3_runtime = 60
phase_3_ioengine = libaio

[client2_good]
description = Good tenant: 256M randread at 50k IOPS for 60s on every phase
file_size = 256M

phase_0_pattern = randread
phase_0_block_size = 4k
phase_0_rate_iops = 50000
phase_0_iodepth = 8
phase_0_numjobs = 1
phase_0_runtime = 60
phase_0_ioengine = libaio

phase_1_pattern = randread
phase_1_block_size = 4k
phase_1_rate_iops = 50000
phase_1_iodepth = 8
phase_1_numjobs = 1
phase_1_runtime = 60
phase_1_ioengine = libaio

phase_2_pattern = randread
phase_2_block_size = 4k
phase_2_rate_iops = 50000
phase_2_iodepth = 8
phase_2_numjobs = 1
phase_2_runtime = 60
phase_2_ioengine = libaio

phase_3_pattern = randread
phase_3_block_size = 4k
phase_3_rate_iops = 50000
phase_3_iodepth = 8
phase_3_numjobs = 1
phase_3_runtime = 60
phase_3_ioengine = libaio


; ================================================================
; Noisy neighbor. Each phase is 60s. rate_iops is per job.
;   phase 0: 1024 IOPS x 1 job x 4k → ~240 MiB (little eviction)
;   phase 1: 73000 IOPS x 4 jobs → reads issued exceed the 32G file and the 2G pool
;   phase 2: same as phase 0 (quiet)
;   phase 3: same as phase 0 (quiet)
; ================================================================
[client3_noisy]
description = Noisy neighbor: 32G sequential read, 1k -> 73k x4 -> 1k -> 1k over 60s phases
file_size = 32G
filename = test_file_client2_noisy_32G

phase_0_pattern = read
phase_0_block_size = 4k
phase_0_rate_iops = 1024
phase_0_iodepth = 8
phase_0_numjobs = 1
phase_0_runtime = 60
phase_0_ioengine = libaio

phase_1_pattern = read
phase_1_block_size = 4k
phase_1_rate_iops = 73000
phase_1_iodepth = 8
phase_1_numjobs = 4
phase_1_runtime = 60
phase_1_ioengine = libaio

phase_2_pattern = read
phase_2_block_size = 4k
phase_2_rate_iops = 1024
phase_2_iodepth = 8
phase_2_numjobs = 1
phase_2_runtime = 60
phase_2_ioengine = libaio

phase_3_pattern = read
phase_3_block_size = 4k
phase_3_rate_iops = 1024
phase_3_iodepth = 8
phase_3_numjobs = 1
phase_3_runtime = 60
phase_3_ioengine = libaio
