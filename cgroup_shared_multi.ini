; cgroup_shared_multi.ini — three tenants, one 2G page-cache pool.
; Both good tenants and the noisy neighbor live under the same parent so they
; compete for the same cache. Pair with fairness_configs_multi.ini.

[clients]
cgroup_name = clients
memory.max = 2G

[client1_good]
cgroup_name = clients/client1_good
io.weight = 100

[client2_good]
cgroup_name = clients/client2_good
io.weight = 100

[client3_noisy]
cgroup_name = clients/client3_noisy
io.weight = 100
