; cgroup_isolated_multi.ini — one private cgroup per tenant.
; Each tenant has memory.max and memory.min set to 1G, matching
; cgroup_isolated.ini. There is no shared parent cap.

[client1_good]
cgroup_name = client1_good
io.weight = 100
memory.max = 1G
memory.min = 1G

[client2_good]
cgroup_name = client2_good
io.weight = 100
memory.max = 1G
memory.min = 1G

[client3_noisy]
cgroup_name = client3_noisy
io.weight = 100
memory.max = 1G
memory.min = 1G
